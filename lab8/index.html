<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemain Video - AI-VIDEO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #1e293b, #090d16);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f1f5f9;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    video {
      width: 100%;
      max-height: 75vh;
      display: block;
      outline: none;
    }
    .footer-note {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">AI-VIDEO</div>
      <div class="badge">Local Player</div>
    </div>

    <div class="video-wrapper">
      <video controls playsinline autoplay muted>
        <!-- Menyokong pelbagai format biasa mengikut nama AI-VIDEO -->
        <source src="AI-VIDEO.mp4" type="video/mp4">
        <source src="AI-VIDEO.mov" type="video/quicktime">
        <source src="AI-VIDEO.webm" type="video/webm">
        <source src="AI-VIDEO.mkv" type="video/x-matroska">
        Pelayar web anda tidak menyokong format video ini.
      </video>
    </div>

    <p class="footer-note">Memainkan fail dari folder <code>AI-VIDEO</code></p>
  </div>

</body>
</html>
